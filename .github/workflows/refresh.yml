name: Refresh dashboard data

on:
  schedule:
    # 04:10 UTC = 06:10 Bratislava while CEST is in effect (05:10 UTC in winter).
    - cron: "10 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull fresh Shopify data into index.html
        env:
          SHOPIFY_SHOP: zr1zpm-bj.myshopify.com
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION || '2026-07' }}
        run: node refresh.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "afterglow-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No change in the data - nothing to commit."
          else
            git commit -m "Refresh Shopify data $(date -u +%F)"
            git push
          fi
